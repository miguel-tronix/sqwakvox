[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sqwakvox"
version = "0.1.0"
description = "Local AI Financial Document Assistant with Textual TUI, Docling Ingestion, and Mozilla any-guardrail Validation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Miguel de Sousa", email = "miguel.tronix@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "textual>=0.50.0",
    "docling>=2.0.0",
    "any-guardrail>=0.1.0",
    "pydantic>=2.6.0",
    "jinja2>=3.1.0",
    "any-agent[langchain]>=1.18.0",
]

[dependency-groups]
dev = [
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "types-jinja2>=2.11.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sqwakvox"]

[project.scripts]
sqwakvox = "sqwakvox.__main__:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "YTT",  # sys.version_info
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "T10",  # flake8-debugger
    "T20",  # flake8-print
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "ERA",  # flake8-eradicate (commented-out code)
    "RUF",  # Ruff-specific rules
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["sqwakvox"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true
show_error_context = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "docling.*",
    "any_guardrail.*",
    "textual.*",
]
ignore_missing_imports = true

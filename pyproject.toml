[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sqwakvox"
version = "1.6.0"
description = "Local AI Financial Document Assistant with Textual TUI, Docling Ingestion, and Mozilla any-guardrail Validation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Miguel de Sousa", email = "miguel.tronix@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "textual>=0.50.0",
    "docling>=2.0.0",
    "any-guardrail>=0.1.0",
    "pydantic>=2.6.0",
    "jinja2>=3.1.0",
    # any-llm provides one `"provider:model"` interface over every LLM
    # provider (see src/sqwakvox/llm.py). any-guardrail also requires it.
    "any-llm-sdk>=1.15.0",
    "langchain-core>=1.0.0",
    "langgraph>=1.0.0",
    "langchain-mcp-adapters>=0.2.2",
    "google-genai>=2.6.0",
    # fastmcp 3.x requires mcp<2.0 (its server imports McpError from
    # mcp.shared.exceptions, removed in mcp 2.0.0). Keep the upper bound so a
    # resolver can never pull in an incompatible mcp 2.x again.
    "mcp>=1.29.0,<2.0",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "celery>=5.3.0",
    "redis>=5.0.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "fastmcp>=3.4.7",
    # Web presenter: Starlette serves the single-page app, SSE and the MCP
    # tool bridge; uvicorn runs it.  Both arrive transitively with fastmcp but
    # are imported directly, so declare them.
    "starlette>=1.0.0",
    "uvicorn>=0.34.0",
    "numpy>=1.26.0",
    "ebooklib>=0.20",
    # Cheap PDF page count (no OCR) so large PDFs load incrementally by slice.
    "pypdfium2>=4.0.0",
    "pytest-cov>=7.1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "types-jinja2>=2.11.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sqwakvox"]

[tool.hatch.build.targets.wheel.force-include]
"src/sqwakvox/web_ui" = "sqwakvox/web_ui"

[project.scripts]
sqwakvox = "sqwakvox.__main__:main"
sqwakvox-web = "sqwakvox.web_presenter:main"
sqwakvox-presenter-mcp = "sqwakvox.mcp_presenter:main"
[tool.uv]
cache-dir="/home2/app2/uv"
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "YTT",  # sys.version_info
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "T10",  # flake8-debugger
    "T20",  # flake8-print
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "ERA",  # flake8-eradicate (commented-out code)
    "RUF",  # Ruff-specific rules
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Test doubles mirror the real signatures of the classes they stand in for, so
# the unused parameters are the contract, not dead arguments.
"tests/*" = ["ARG001", "ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["sqwakvox"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
show_error_context = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "docling.*",
    "any_guardrail.*",
    "textual.*",
    "numpy.*",
    "mcp.*",
    "opentelemetry.*",
    "celery.*",
    "kombu.*",
]
ignore_missing_imports = true
